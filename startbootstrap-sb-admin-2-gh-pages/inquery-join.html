    <!-- 페이지 전용 스크립트 -->
    <script>
        // ===== 1. "진짜 같은" 신규 가입자 수 데이터 =====
        const joinUserData = [
            { date: '2025-11-18', count: 25 },
            { date: '2025-11-19', count: 32 },
            { date: '2025-11-20', count: 28 },
            { date: '2025-11-21', count: 40 },
            { date: '2025-11-22', count: 35 },
            { date: '2025-11-23', count: 30 },
            { date: '2025-11-24', count: 45 }
        ];

        // ===== 2. 표(Table)에 데이터 채우기 =====
        const joinTbody = document.querySelector('#joinUserTable tbody');

        joinUserData.forEach(row => {
            const tr = document.createElement('tr');

            const tdDate = document.createElement('td');
            tdDate.textContent = row.date;

            const tdCount = document.createElement('td');
            tdCount.textContent = row.count.toLocaleString(); // 1,234 처럼 표시

            tr.appendChild(tdDate);
            tr.appendChild(tdCount);
            joinTbody.appendChild(tr);
        });

        // ===== 3. Chart.js로 막대 그래프 그리기 =====
        const joinCtx = document.getElementById('joinUserChart').getContext('2d');

        const joinLabels = joinUserData.map(row => row.date);
        const joinCounts = joinUserData.map(row => row.count);

        new Chart(joinCtx, {
            type: 'bar',
            data: {
                labels: joinLabels,
                datasets: [{
                    label: '신규 가입자 수',
                    data: joinCounts,
                    backgroundColor: 'rgba(28, 200, 138, 0.6)',
                    borderColor: 'rgba(28, 200, 138, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    x: {
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        ticks: {
                            beginAtZero: true,
                            stepSize: 10
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return ' ' + context.parsed.y.toLocaleString() + '명';
                            }
                        }
                    }
                }
            }
        });
    </script>
