    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 shadow">
                <span class="navbar-brand mb-0 h5">관리자 설정</span>
            </nav>

            <div class="container-fluid">

                <h1 class="h3 mb-4 text-gray-800">프로필 / 알림 / 사이트 설정</h1>

                <div class="row">
                    <!-- 알림 설정 -->
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">알림 설정</h6>
                            </div>
                            <div class="card-body">
                                <form>
                                    <div class="form-group">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notifyEmail" checked>
                                            <label class="custom-control-label" for="notifyEmail">이메일 알림 받기</label>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="notifyInquery" checked>
                                            <label class="custom-control-label" for="notifyInquery">새 문의 발생 시 알림</label>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-primary btn-sm" onclick="alert('데모: 실제 저장은 아직 연결되지 않았습니다.');">저장</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- 사이트 표시 설정 -->
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">사이트 표시 설정</h6>
                            </div>
                            <div class="card-body">
                                <form>
                                    <div class="form-group">
                                        <label>관리자 기본 언어</label>
                                        <select class="form-control">
                                            <option>한국어</option>
                                            <option>English</option>
                                            <option>日本語</option>
                                            <option>中文</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>대쉬보드 기본 기간</label>
                                        <select class="form-control">
                                            <option>최근 7일</option>
                                            <option>최근 30일</option>
                                            <option>최근 90일</option>
                                        </select>
                                    </div>
                                    <button type="button" class="btn btn-primary btn-sm" onclick="alert('데모: 실제 저장은 아직 연결되지 않았습니다.');">저장</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
