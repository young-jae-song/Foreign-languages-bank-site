    <!-- 페이지 전용 스크립트 -->
    <script>
        // ===== 1. "진짜 같은" 수익 데이터 (원 단위) =====
        const revenueData = [
            { date: '2025-11-18', amount: 120000 },
            { date: '2025-11-19', amount: 150000 },
            { date: '2025-11-20', amount: 175000 },
            { date: '2025-11-21', amount: 130000 },
            { date: '2025-11-22', amount: 220000 },
            { date: '2025-11-23', amount: 195000 },
            { date: '2025-11-24', amount: 250000 }
        ];

        // ===== 2. 표(Table)에 데이터 채우기 =====
        const revenueTbody = document.querySelector('#revenueTable tbody');

        revenueData.forEach(row => {
            const tr = document.createElement('tr');

            const tdDate = document.createElement('td');
            tdDate.textContent = row.date;

            const tdAmount = document.createElement('td');
            tdAmount.textContent = row.amount.toLocaleString() + ' 원';

            tr.appendChild(tdDate);
            tr.appendChild(tdAmount);
            revenueTbody.appendChild(tr);
        });

        // ===== 3. Chart.js로 라인 그래프 그리기 =====
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');

        const revenueLabels = revenueData.map(row => row.date);
        const revenueAmounts = revenueData.map(row => row.amount);

        new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: revenueLabels,
                datasets: [{
                    label: '일일 수익 (원)',
                    data: revenueAmounts,
                    backgroundColor: 'rgba(246, 194, 62, 0.1)',
                    borderColor: 'rgba(246, 194, 62, 1)',
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: 'rgba(246, 194, 62, 1)',
                    pointBorderColor: 'rgba(246, 194, 62, 1)',
                    pointHoverRadius: 4,
                    pointHitRadius: 10,
                    pointBorderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    x: {
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        ticks: {
                            beginAtZero: true,
                            callback: function (value) {
                                return value.toLocaleString() + '원';
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return ' ' + context.parsed.y.toLocaleString() + ' 원';
                            }
                        }
                    }
                }
            }
        });
    </script>
