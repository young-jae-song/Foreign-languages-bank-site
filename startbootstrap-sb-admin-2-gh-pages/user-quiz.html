<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>문제 풀기 - 외국어 문제풀이 사이트</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">

<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
    <a class="navbar-brand" href="user-quiz.html">외국어 문제 풀이</a>

    <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
            <a class="nav-link" href="user-quiz.html">문제 풀기</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="user-suggest.html">건의하기</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="user-account.html">내 정보</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#" id="logoutLink">로그아웃</a>
        </li>
    </ul>
</nav>

<div class="container-fluid">

    <h1 class="h3 mb-4 text-gray-800">문제 풀기</h1>

    <!-- 1. 문제 설정 카드 -->
    <div class="card mb-3">
        <div class="card-header py-2">
            <h6 class="m-0 font-weight-bold text-primary">문제 설정</h6>
        </div>
        <div class="card-body">
            <div class="form-row">

                <div class="form-group col-md-3">
                    <label>풀이 방식</label>
                    <select id="quizMode" class="form-control">
                        <option value="step" selected>한 문제씩 풀기</option>
                        <option value="omr">OMR 방식 (전체 먼저 입력)</option>
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label>문제 수</label>
                    <select id="questionCount" class="form-control">
                        <option value="5">5문제</option>
                        <option value="10" selected>10문제</option>
                        <option value="20">20문제</option>
                        <option value="all">전체</option>
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label>과목</label>
                    <select id="subjectFilter" class="form-control">
                        <option value="all">전체</option>
                        <option value="영어">영어</option>
                        <option value="일본어">일본어</option>
                        <option value="중국어">중국어</option>
                    </select>
                </div>

                <div class="form-group col-md-3 d-flex align-items-end">
                    <button id="btnStartQuiz" class="btn btn-primary btn-block">
                        문제 시작
                    </button>
                </div>

            </div>
            <small class="text-muted">
                ※ 문제는 charts.html에서 등록한 localStorage "questions" 데이터를 가져와 사용합니다.
            </small>
        </div>
    </div>

    <!-- 2. 문제 영역 -->
    <div class="card mb-3" id="quizCard">
        <div class="card-header py-2 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">문제</h6>
            <span class="text-muted small" id="quizProgressText"></span>
        </div>
        <div class="card-body">

            <!-- STEP 모드 -->
            <div id="stepModeArea" style="display:none;">
                <div class="mb-3">
                    <div id="stepQuestionNumber" class="font-weight-bold mb-1"></div>
                    <div id="stepQuestionText" class="mb-2"></div>
                </div>
                <div id="stepChoicesArea" class="mb-2"></div>

                <!-- 정답/오답 + 해설 -->
                <div id="stepFeedback" class="mb-3 small"></div>

                <div class="d-flex justify-content-between">
                    <button id="btnQuitStep" class="btn btn-outline-danger btn-sm">
                        그만하기 (지금까지 푼 것만 채점)
                    </button>
                    <div>
                        <button id="btnCheckStep" class="btn btn-secondary btn-sm">
                            정답 확인
                        </button>
                        <button id="btnNextStep" class="btn btn-primary btn-sm">
                            다음 문제
                        </button>
                    </div>
                </div>
            </div>

            <!-- OMR 모드 -->
            <div id="omrModeArea" style="display:none;">
                <div id="omrQuestionsContainer" class="mb-3"></div>
                <div class="d-flex justify-content-between">
                    <button id="btnQuitOmr" class="btn btn-outline-danger btn-sm">
                        그만하기 (지금까지 선택한 것만 채점)
                    </button>
                    <button id="btnSubmitOmr" class="btn btn-primary btn-sm">
                        전체 채점하기
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 3. 결과 영역 -->
    <div class="card mb-3" id="resultCard" style="display:none;">
        <div class="card-header py-2">
            <h6 class="m-0 font-weight-bold text-success">결과</h6>
        </div>
        <div class="card-body" id="resultArea"></div>
    </div>

</div>

<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="js/sb-admin-2.min.js"></script>

<script>


const STORAGE_KEY_QUESTIONS = 'questions';
const STORAGE_KEY_CURRENT_USER = 'currentUserId';
const STORAGE_KEY_USER_RESULTS = 'userQuizResults';
const STORAGE_KEY_USER_ACTIVITIES = 'userActivities';

let allQuestions = [];
let currentQuizQuestions = [];
let currentIndex = 0;
let userAnswers = {};        // { questionId: choiceIndex }
let quizMode = 'step';
let quizStarted = false;

function loadArray(key) {
    try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}

function saveArray(key, arr) {
    localStorage.setItem(key, JSON.stringify(arr));
}

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function loadQuestionsFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY_QUESTIONS);
        if (!raw) return null;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : null;
    } catch (e) {
        return null;
    }
}

function saveQuestionsToStorage(list) {
    localStorage.setItem(STORAGE_KEY_QUESTIONS, JSON.stringify(list));
}

/* 🔥 핵심 초기화 */
function initQuestionsIfEmpty() {
    let questions = loadQuestionsFromStorage();
    if (!questions) {
        // 관리자 페이지와 동일한 기본 문제 생성
        questions = generateDefaultQuestions(); // 또는 기본 문제 배열
        saveQuestionsToStorage(questions);
    }
    return questions;
}

// 초기 문제 로드
(function initQuestions() {
    const stored = loadArray(STORAGE_KEY_QUESTIONS);
    allQuestions = stored.filter(q => q && q.content && Array.isArray(q.choices));
})();

// 로그아웃
document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    localStorage.removeItem(STORAGE_KEY_CURRENT_USER);
    location.href = 'login.html';
});

document.addEventListener('DOMContentLoaded', () => {
    const questions = initQuestionsIfEmpty();
    renderQuestions(questions); // 기존 문제 출력 함수
});


// 문제 시작
document.getElementById('btnStartQuiz').addEventListener('click', () => {
    if (!allQuestions.length) {
        alert('등록된 문제가 없습니다. 관리자(charts.html)에서 먼저 문제를 추가해주세요.');
        return;
    }

    const modeSelect = document.getElementById('quizMode');
    const countSelect = document.getElementById('questionCount');
    const subjectSelect = document.getElementById('subjectFilter');

    quizMode = modeSelect.value;
    const countValue = countSelect.value;
    const subjectValue = subjectSelect.value;

    let pool = allQuestions;
    if (subjectValue !== 'all') {
        pool = pool.filter(q => (q.subject || '') === subjectValue);
    }
    if (!pool.length) {
        alert('해당 과목에 등록된 문제가 없습니다.');
        return;
    }

    let selected = shuffleArray(pool);
    if (countValue !== 'all') {
        const n = parseInt(countValue, 10);
        selected = selected.slice(0, Math.min(n, selected.length));
    }

    currentQuizQuestions = selected;
    currentIndex = 0;
    userAnswers = {};
    quizStarted = true;

    document.getElementById('resultCard').style.display = 'none';
    updateProgressText();

    if (quizMode === 'step') {
        document.getElementById('stepModeArea').style.display = '';
        document.getElementById('omrModeArea').style.display = 'none';
        renderStepQuestion();
    } else {
        document.getElementById('stepModeArea').style.display = 'none';
        document.getElementById('omrModeArea').style.display = '';
        renderOmrSheet();
    }
});

function updateProgressText() {
    const text = document.getElementById('quizProgressText');
    if (!quizStarted || !currentQuizQuestions.length) {
        text.textContent = '';
        return;
    }
    if (quizMode === 'step') {
        text.textContent = `${currentIndex + 1} / ${currentQuizQuestions.length}`;
    } else {
        text.textContent = `총 ${currentQuizQuestions.length}문제 (OMR 방식)`;
    }
}

/* ===== STEP 모드 ===== */

function renderStepQuestion() {
    const q = currentQuizQuestions[currentIndex];
    if (!q) return;

    updateProgressText();

    const numEl = document.getElementById('stepQuestionNumber');
    const textEl = document.getElementById('stepQuestionText');
    const choicesEl = document.getElementById('stepChoicesArea');
    const feedbackEl = document.getElementById('stepFeedback');

    numEl.textContent = (currentIndex + 1) + '번';
    textEl.textContent = q.content || '';   // Q21 같은 프리픽스 안 씀

    choicesEl.innerHTML = '';
    (q.choices || []).forEach((choice, idx) => {
        const id = `step_q_${q.id}_${idx}`;
        const div = document.createElement('div');
        div.className = 'form-check';
        div.innerHTML = `
            <input class="form-check-input"
                   type="radio"
                   name="step_q_${q.id}"
                   id="${id}"
                   value="${idx}">
            <label class="form-check-label" for="${id}">
                ${choice}
            </label>
        `;
        choicesEl.appendChild(div);
    });

    feedbackEl.innerHTML = '';
}

function getSelectedChoiceIndexStep() {
    const q = currentQuizQuestions[currentIndex];
    if (!q) return null;
    const checked = document.querySelector(`input[name="step_q_${q.id}"]:checked`);
    if (!checked) return null;
    return parseInt(checked.value, 10);
}

// 정답 확인
document.getElementById('btnCheckStep').addEventListener('click', () => {
    if (!quizStarted || quizMode !== 'step') return;
    const q = currentQuizQuestions[currentIndex];
    if (!q) return;

    const selectedIndex = getSelectedChoiceIndexStep();
    if (selectedIndex == null) {
        alert('먼저 답을 선택해주세요.');
        return;
    }

    userAnswers[q.id] = selectedIndex;

    const feedbackEl = document.getElementById('stepFeedback');
    const isCorrect = (selectedIndex === q.answer);
    const correctNum = (q.answer != null ? (q.answer + 1) : '?');
    const explanation = q.explanation || q.explain || '';

    if (isCorrect) {
        feedbackEl.innerHTML = `
            <div class="text-success font-weight-bold mb-1">정답입니다!</div>
            ${explanation ? `<div class="text-muted">해설: ${explanation}</div>` : ''}
        `;
    } else {
        feedbackEl.innerHTML = `
            <div class="text-danger font-weight-bold mb-1">오답입니다.</div>
            <div class="text-muted mb-1">정답: ${correctNum}번</div>
            ${explanation ? `<div class="text-muted">해설: ${explanation}</div>` : ''}
        `;
    }
});

// 다음 문제
document.getElementById('btnNextStep').addEventListener('click', () => {
    if (!quizStarted || quizMode !== 'step') return;

    currentIndex++;
    if (currentIndex >= currentQuizQuestions.length) {
        showResult();
    } else {
        renderStepQuestion();
    }
});

// 그만하기
document.getElementById('btnQuitStep').addEventListener('click', () => {
    if (!quizStarted || quizMode !== 'step') return;
    if (!confirm('정말 그만하시겠습니까?\n지금까지 푼 문제만 기준으로 결과를 보여드립니다.')) return;
    showResult();
});

/* ===== OMR 모드 ===== */

function renderOmrSheet() {
    const container = document.getElementById('omrQuestionsContainer');
    container.innerHTML = '';

    currentQuizQuestions.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'mb-3 p-2 border rounded';

        const numberLabel = (idx + 1) + '번';
        const contentText = q.content || '';

        div.innerHTML = `
            <div class="font-weight-bold mb-1">${numberLabel}</div>
            <div class="mb-2">${contentText}</div>
            <div>
                ${(q.choices || []).map((choice, ci) => `
                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="omr_q_${q.id}"
                               id="omr_q_${q.id}_${ci}"
                               value="${ci}">
                        <label class="form-check-label"
                               for="omr_q_${q.id}_${ci}">
                            ${choice}
                        </label>
                    </div>
                `).join('')}
            </div>
        `;
        container.appendChild(div);
    });

    updateProgressText();
}

// 전체 채점
document.getElementById('btnSubmitOmr').addEventListener('click', () => {
    if (!quizStarted || quizMode !== 'omr') return;

    userAnswers = {};
    currentQuizQuestions.forEach(q => {
        const checked = document.querySelector(`input[name="omr_q_${q.id}"]:checked`);
        if (checked) {
            userAnswers[q.id] = parseInt(checked.value, 10);
        }
    });

    showResult();
});

// 그만하기
document.getElementById('btnQuitOmr').addEventListener('click', () => {
    if (!quizStarted || quizMode !== 'omr') return;
    if (!confirm('정말 그만하시겠습니까?\n지금까지 선택한 답만 기준으로 결과를 보여드립니다.')) return;

    userAnswers = {};
    currentQuizQuestions.forEach(q => {
        const checked = document.querySelector(`input[name="omr_q_${q.id}"]:checked`);
        if (checked) {
            userAnswers[q.id] = parseInt(checked.value, 10);
        }
    });

    showResult();
});

/* ===== 결과 계산 & 저장 ===== */

function showResult() {
    quizStarted = false;

    let correct = 0;
    let wrong = 0;
    const wrongQuestionIds = [];

    currentQuizQuestions.forEach(q => {
        const ans = userAnswers[q.id];
        if (ans == null) return; // 안 푼 문제 제외

        if (ans === q.answer) {
            correct++;
        } else {
            wrong++;
            wrongQuestionIds.push(q.id);
        }
    });

    const totalAnswered = correct + wrong;
    const score = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;

    const resultCard = document.getElementById('resultCard');
    const resultArea = document.getElementById('resultArea');
    resultCard.style.display = '';
    resultArea.innerHTML = `
        <p>풀이 방식: <b>${quizMode === 'step' ? '한 문제씩' : 'OMR 방식'}</b></p>
        <p>푼 문제 수: <b>${totalAnswered}</b>개</p>
        <p>맞힌 개수: <b>${correct}</b>개</p>
        <p>틀린 개수: <b>${wrong}</b>개</p>
        <p>점수: <b>${score}</b>점</p>
    `;

    saveQuizResultForAccount(score, correct, wrong, totalAnswered, wrongQuestionIds);
}

function saveQuizResultForAccount(score, correct, wrong, totalAnswered, wrongQuestionIds) {
    const currentUserId = localStorage.getItem(STORAGE_KEY_CURRENT_USER);
    if (!currentUserId) return;

    const subject = currentQuizQuestions[0] ? (currentQuizQuestions[0].subject || '-') : '-';

    const resultObj = {
        userId: currentUserId,
        date: new Date().toISOString(),
        subject,
        score,
        total: totalAnswered,
        correctCount: correct,
        wrongCount: wrong,
        wrongQuestionIds
    };

    const results = loadArray(STORAGE_KEY_USER_RESULTS);
    results.push(resultObj);
    saveArray(STORAGE_KEY_USER_RESULTS, results);

    const acts = loadArray(STORAGE_KEY_USER_ACTIVITIES);
    acts.push({
        userId: currentUserId,
        time: resultObj.date,
        type: 'quiz',
        message: `${subject} 문제 풀이: ${correct}/${totalAnswered}개 정답 (${score}점)`
    });
    saveArray(STORAGE_KEY_USER_ACTIVITIES, acts);
}
</script>

</body>
</html>
