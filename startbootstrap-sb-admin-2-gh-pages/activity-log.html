    <script>
        const STORAGE_KEY_ACTIVITIES = 'adminActivities';

        // 기본 데모 활동 (최초 진입용)
        const demoActivities = [
            {
                time: '2025-11-24 18:30',
                message: '외국어 문제 3개 수정 (문제 관리)',
                badge: '문제 관리',
                badgeClass: 'badge-primary',
                target: 'charts.html'
            },
            {
                time: '2025-11-24 17:10',
                message: '사용자 건의 2건 확인 (문의 내역)',
                badge: '문의',
                badgeClass: 'badge-info',
                target: 'inquery.html'
            },
            {
                time: '2025-11-24 16:05',
                message: '광고 배너 이미지 교체 (광고 관리)',
                badge: '광고',
                badgeClass: 'badge-warning',
                target: 'advertisement.html'
            },
            {
                time: '2025-11-24 15:20',
                message: '회원 정보 1건 수정 (개인정보)',
                badge: '사용자',
                badgeClass: 'badge-success',
                target: 'tables.html'
            }
        ];

        function loadActivities() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_ACTIVITIES);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch (e) {
                return [];
            }
        }

        function renderActivities() {
            const list = document.getElementById('activityList');
            list.innerHTML = '';

            const stored = loadActivities(); // 사용자/관리자 행동으로 쌓인 로그
            // 최신 것이 위로 오게 뒤집고, 그 뒤에 데모 데이터 붙이기
            const all = stored.slice().reverse().concat(demoActivities);

            all.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.style.cursor = 'pointer';

                li.innerHTML = `
            <span>[${item.time}] ${item.message}</span>
            <span class="badge ${item.badgeClass} badge-pill">${item.badge}</span>
        `;

                if (item.target) {
                    li.addEventListener('click', () => {
                        window.location.href = item.target;
                    });
                }

                list.appendChild(li);
            });

            if (all.length === 0) {
                const li = document.createElement('li');
                li.className = 'list-group-item text-muted';
                li.textContent = '아직 기록된 활동이 없습니다.';
                list.appendChild(li);
            }
        }

        renderActivities();
    </script>
